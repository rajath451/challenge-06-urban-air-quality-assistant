services:
  - type: web
    name: vayucoach-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SMTP_MOCK_FALLBACK
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
